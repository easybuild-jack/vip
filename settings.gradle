rootProject.name = 'vip'

dependencyResolutionManagement.versionCatalogs {
    libs {
        library("dependencies", "com.mcst:easyfk-dependencies:3.5.16")
        library("moduleDependencies", "com.mcst:module-dependencies:3.5.16")
        // lombok 的版本已由 easyfk-dependencies BOM（bundle 'base'）统一托管，此处不再单独声明
        library('lombokMapstruct', 'org.projectlombok:lombok-mapstruct-binding:0.2.0')
        library('mapstructProcessor', 'io.github.linpeilie:mapstruct-plus-processor:1.5.3')
        library('processor', 'org.springframework.boot:spring-boot-configuration-processor:3.5.16')
    }
}

include 'vip-server'
include 'vip-api'

include 'vip-orm'
include 'vip-orm:vip-orm-api'
findProject(':vip-orm:vip-orm-api')?.name = 'vip-orm-api'
include 'vip-orm:vip-orm-plus'
findProject(':vip-orm:vip-orm-plus')?.name = 'vip-orm-plus'
include 'vip-orm:vip-orm-flex'
findProject(':vip-orm:vip-orm-flex')?.name = 'vip-orm-flex'
include 'vip-orm:vip-orm-hibernate'
findProject(':vip-orm:vip-orm-hibernate')?.name = 'vip-orm-hibernate'

include 'vip-prd'
include 'vip-prd:vip-prd-client'
findProject(':vip-prd:vip-prd-client')?.name = 'vip-prd-client'
include 'vip-prd:vip-prd-bms'
findProject(':vip-prd:vip-prd-bms')?.name = 'vip-prd-bms'

include 'vip-remote'
include 'vip-remote:vip-cloud-api'
findProject(':vip-remote:vip-cloud-api')?.name = 'vip-cloud-api'
include 'vip-remote:vip-cloud-provider'
findProject(':vip-remote:vip-cloud-provider')?.name = 'vip-cloud-provider'
include 'vip-remote:vip-dubbo-api'
findProject(':vip-remote:vip-dubbo-api')?.name = 'vip-dubbo-api'
include 'vip-remote:vip-dubbo-provider'
findProject(':vip-remote:vip-dubbo-provider')?.name = 'vip-dubbo-provider'
